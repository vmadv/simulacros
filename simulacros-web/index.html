<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Los simulacros de Vázquez</title>
<meta name="description" content="Los simulacros de Vázquez: simulacros tipo test para la oposición al Cuerpo Superior Facultativo, opción Ingeniería Agronómica (A1.2002) de la Junta de Andalucía.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: columna de lectura centrada; en examen, pregunta + rejilla de navegación lateral */
:root {
  --bg: #f7f8f4;
  --surface: #ffffff;
  --surface-2: #eef1e8;
  --ink: #1c2417;
  --muted: #5d6656;
  --line: #d8ddd0;
  --accent: #46682b;
  --accent-ink: #ffffff;
  --accent-soft: #e2ebd6;
  --ok: #2f7a3b;
  --ok-soft: #dcefdc;
  --ko: #b23b2a;
  --ko-soft: #f7dfda;
  --flag: #a8741b;
  --flag-soft: #f5e8cc;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12160f; --surface: #1a2016; --surface-2: #222a1d; --ink: #e6ebdf; --muted: #a2ab98; --line: #333d2c;
    --accent: #9cc46f; --accent-ink: #12160f; --accent-soft: #2b3a20; --ok: #7fcf88; --ok-soft: #1f3522;
    --ko: #ef8b78; --ko-soft: #3d2420; --flag: #e3b25b; --flag-soft: #3a2f19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12160f; --surface: #1a2016; --surface-2: #222a1d; --ink: #e6ebdf; --muted: #a2ab98; --line: #333d2c;
  --accent: #9cc46f; --accent-ink: #12160f; --accent-soft: #2b3a20; --ok: #7fcf88; --ok-soft: #1f3522;
  --ko: #ef8b78; --ko-soft: #3d2420; --flag: #e3b25b; --flag-soft: #3a2f19; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
h4 { font-size: 1rem; margin-top: 1rem; }
p { margin: 0; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, label:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.marca { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; text-decoration: none; color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
.marca small { font-family: var(--font-mono); font-size: .75rem; color: var(--accent); font-weight: 500; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-weight: 500; font-size: .93rem; }
.nav a[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
.nav a:hover { color: var(--ink); }

.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 28px; }
.lectura { max-width: 760px; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 600; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primario:hover { filter: brightness(1.06); }
.btn.peligro { border-color: var(--ko); color: var(--ko); }
.btn.mini { padding: 5px 10px; font-size: .88rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Inicio */
.cabecera { display: grid; gap: 14px; }
.cabecera p { max-width: 64ch; color: var(--muted); }
.cuenta { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.cuenta .grande { font-family: var(--font-display); font-size: 2rem; font-weight: 700; line-height: 1; }
.cuenta label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
.cuenta input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.sims { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.sim { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 10px; align-content: start; }
.sim .meta { font-size: .88rem; color: var(--muted); }
.sim .mejor { font-size: .85rem; }
.herramientas { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.herr { border-top: 2px solid var(--ink); padding-top: 10px; display: grid; gap: 8px; align-content: start; }
.herr p { font-size: .93rem; color: var(--muted); }

/* Barras de progreso por tema */
.temas { display: grid; gap: 8px; }
.tema-fila { display: grid; grid-template-columns: minmax(0, 1fr) 110px 70px; gap: 12px; align-items: center; font-size: .92rem; }
.tema-fila .nombre { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.barra i.bajo { background: var(--ko); }
.barra i.medio { background: var(--flag); }
.tema-fila .pct { text-align: right; }

.tabla { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .82rem; }
td.num, th.num { text-align: right; }

/* Examen */
.examen-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.examen-top .top-in { gap: 12px; }
.reloj { font-family: var(--font-mono); font-size: 1.15rem; padding: 4px 10px; border-radius: 6px; background: var(--surface-2); }
.reloj.aviso { background: var(--ko-soft); color: var(--ko); }
.examen { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
@media (max-width: 860px) { .examen { grid-template-columns: minmax(0, 1fr); } }
.pregunta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 16px; min-width: 0; }
.pregunta .enun { font-size: 1.07rem; font-weight: 600; line-height: 1.5; }
.opciones { display: grid; gap: 10px; }
.op { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; }
.op .letra { font-family: var(--font-mono); font-weight: 500; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; background: var(--surface-2); }
.op:hover { border-color: var(--muted); }
.op.sel { border-color: var(--accent); background: var(--accent-soft); }
.op.sel .letra { background: var(--accent); color: var(--accent-ink); }
.op.ok { border-color: var(--ok); background: var(--ok-soft); }
.op.ok .letra { background: var(--ok); color: var(--surface); }
.op.ko { border-color: var(--ko); background: var(--ko-soft); }
.op.ko .letra { background: var(--ko); color: var(--surface); }
.op[disabled] { cursor: default; }
.explica { border-left: 3px solid var(--accent); background: var(--surface-2); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: .95rem; }
.explica b { display: block; margin-bottom: 4px; }
.pie-preg { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.dudosa-on { border-color: var(--flag); color: var(--flag); background: var(--flag-soft); }
.supuesto { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.supuesto summary { padding: 12px 16px; cursor: pointer; font-weight: 600; }
.supuesto .cuerpo { padding: 0 16px 16px; display: grid; gap: 10px; font-size: .95rem; }
.supuesto .cuerpo table { font-size: .88rem; }
.lateral { display: grid; gap: 14px; position: sticky; top: 76px; }
@media (max-width: 860px) { .lateral { position: static; } }
.rejilla { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.rejilla button { font-family: var(--font-mono); font-size: .72rem; padding: 5px 0; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); }
.rejilla button.resp { background: var(--accent-soft); border-color: var(--accent); }
.rejilla button.duda { background: var(--flag-soft); border-color: var(--flag); }
.rejilla button.actual { outline: 2px solid var(--ink); outline-offset: 1px; }
.rejilla button.ok { background: var(--ok-soft); border-color: var(--ok); }
.rejilla button.ko { background: var(--ko-soft); border-color: var(--ko); }
.rejilla .sep { grid-column: 1 / -1; font-size: .72rem; color: var(--muted); margin-top: 6px; }
.leyenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
.leyenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); }
.leyenda .l-resp::before { background: var(--accent-soft); border-color: var(--accent); }
.leyenda .l-duda::before { background: var(--flag-soft); border-color: var(--flag); }
.aviso-panel { border: 1px solid var(--ko); background: var(--ko-soft); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.pausa { text-align: center; padding: 60px 16px; display: grid; gap: 14px; justify-items: center; }

/* Resultados */
.resumen { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.bloque-res { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 10px; }
.notas { display: flex; gap: 22px; flex-wrap: wrap; }
.nota { display: grid; }
.nota .valor { font-family: var(--font-display); font-size: 2.1rem; font-weight: 700; line-height: 1.1; }
.nota .etq { font-size: .8rem; color: var(--muted); }
.conteo { display: flex; gap: 14px; flex-wrap: wrap; font-size: .92rem; }
.conteo .c-ok { color: var(--ok); } .conteo .c-ko { color: var(--ko); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 99px; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.revision { display: grid; gap: 14px; }
.rev { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
.rev .cab { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.estado { font-weight: 700; font-size: .78rem; padding: 2px 8px; border-radius: 99px; }
.estado.ok { background: var(--ok-soft); color: var(--ok); }
.estado.ko { background: var(--ko-soft); color: var(--ko); }
.estado.bl { background: var(--surface-2); color: var(--muted); }
.rev ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; font-size: .94rem; }
.rev li { padding: 4px 8px; border-radius: 6px; }
.rev li.correcta { background: var(--ok-soft); }
.rev li.marcada { background: var(--ko-soft); }

/* Práctica y tarjetas */
.config { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 16px; }
.checks { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.checks label { display: flex; gap: 8px; align-items: center; font-size: .94rem; padding: 6px 8px; border-radius: 6px; background: var(--bg); }
.checks label small { margin-left: auto; color: var(--muted); font-family: var(--font-mono); }
select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); }
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 18px; min-height: 260px; align-content: start; }
.tarjeta .resp { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: var(--ok); }

/* Guía */
.guia { display: grid; gap: 26px; }
.guia section { display: grid; gap: 10px; }
.guia ul, .guia ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; }
.guia p, .guia li { max-width: 68ch; }
.dato { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.dato div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.dato b { display: block; font-family: var(--font-display); font-size: 1.5rem; }
.vacio { color: var(--muted); font-size: .94rem; padding: 14px; border: 1px dashed var(--line); border-radius: var(--radius); }
.pie { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; font-size: .82rem; color: var(--muted); }
.acceso { min-height: 80vh; display: grid; place-items: center; padding-inline: 16px; }
.acceso form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; display: grid; gap: 14px; }
.acceso input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.acceso .error { color: var(--ko); font-size: .9rem; }
.ajustes { display: flex; gap: 8px; align-items: center; font-size: .92rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<footer class="pie" id="pie">Preguntas de elaboración propia a partir de los contenidos del temario. Los datos estadísticos cambian cada año: contrástalos siempre con la última edición del anuario o informe correspondiente.</footer>

<script src="datos/teoria-a.js"></script>
<script src="datos/teoria-b.js"></script>
<script src="datos/supuestos.js"></script>
<script src="app.js"></script>
</body>
</html>
